{% extends "base.html" %}
{% from "partials/_pets.html" import cachorro_dormindo %}

{% block conteudo %}

  {{ cachorro_dormindo("mb-2") }}
  <p class="titulo-pet display-4 mb-0">{{ codigo }}</p>
  <h1 class="h2">{{ titulo }}</h1>
  <p class="texto-suave mx-auto medida">{{ mensagem }}</p>
  <div class="d-flex justify-content-center gap-2 mt-3">

  </div>
</div>
{% endblock %}
