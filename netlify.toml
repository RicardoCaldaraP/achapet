# Deploy na Netlify: o site (React/Vite) e a API (Express como função serverless).
[build]
  command = "npm run build"
  publish = "frontend/dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["@prisma/client", "@prisma/adapter-pg", "pg", "pino", "pino-http"]
  # Cliente do Prisma gerado no build (fica fora do pacote @prisma/client).
  included_files = ["node_modules/.prisma/**", "node_modules/@prisma/client/runtime/**"]

# Todas as chamadas /api/* vão para a função "api" (Express).
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# React Router: qualquer outra rota devolve o index.html (SPA).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
